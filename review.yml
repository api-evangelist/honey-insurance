  apisYmlUpdated: true
  reason: |
    Bootstrap recorded as an honest stub. Honey Insurance has no public,
    self-serve API surface, so apis[] is deliberately empty rather than padded
    with an undocumented internal host or a marketing page dressed up as a
    developer portal. The measurable finding is the absence itself: a
    well-funded, technology-forward Australian insurtech with an entirely
    closed integration posture, no ACORD footprint, and no open-insurance
    obligation to force one open.
