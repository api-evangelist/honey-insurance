aid: honey-insurance
name: Honey Insurance
review:
  question: Does Honey Insurance expose a public, self-serve developer portal or a documented insurance API (quote, bind, issue, FNOL)?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  gated: true
  specsHarvested: 0
findings:
  summary: |
    Honey Insurance publishes no public API surface of any kind. Every
    first-party developer path was probed on 2026-07-25 and none exists:
    developer.honeyinsurance.com, developers.honeyinsurance.com and
    docs.honeyinsurance.com do not resolve (NXDOMAIN), and
    /developers, /developer, /api, /partners and /integrations all return
    HTTP 404 from www.honeyinsurance.com. The published sitemap
    (https://www.honeyinsurance.com/sitemap-0.xml, HTTP 200, 80 URLs) contains
    no developer, API, partner-portal or broker page whatsoever — the site is
    a consumer marketing and self-service funnel plus a blog and newsroom.

    A real backend host does exist. api.honeyinsurance.com resolves and answers
    with application/json, but every path probed — /, /openapi.json,
    /openapi.yaml, /swagger.json, /api-docs, /docs, /v1/openapi.json, /graphql,
    /health, /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server — returns HTTP 403 with the body
    {"message":"Forbidden"}. That is the AWS API Gateway default deny response.
    This is the private backend for Honey's own quote funnel and account app,
    not a third-party API, and nothing about it is documented. No spec was
    harvested and none was inferred.

    The only anonymously reachable standards-based surface is an Auth0
    custom-domain tenant at auth.honeyinsurance.com, which serves OpenID
    Connect discovery at /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server (both HTTP 200) plus a JWKS at
    /.well-known/jwks.json (HTTP 200). This is consumer account sign-in for
    "My account" — the advertised scopes are the stock Auth0 OIDC profile
    claims (openid, profile, offline_access, name, given_name, family_name,
    nickname, email, email_verified, picture, created_at, identities, phone,
    address). There are no insurance-domain scopes, no API audience is
    published, and there is no developer credential issuance path. Treating
    this as a developer auth model would be a misread; it is an end-user login.

    Quote, bind, issue and FNOL all exist at Honey — they are simply not
    exposed as APIs. Quote and bind run as a consumer web journey at
    /get-a-quote/start (three product entry points: homeowners, landlord,
    renters). Policy issue and document delivery sit behind the authenticated
    /my-account area. FNOL is lodged online at /my-account/claims, by phone on
    137 138 (24/7), or by email to contact@honeyinsurance.com. Every one of the
    four verbs is consumer-facing only; none is agent-facing or partner-facing
    in any documented, self-serve, machine-readable form.

    ACORD posture: no ACORD reference found. Searches across the homepage,
    /about-us/, /documents/, /contact-us/, /general-conditions/ and the
    Finsure partnership release returned zero hits for ACORD, AL3, ACORD XML,
    ACORD certified or NGDS. This is expected and coherent — Honey is an
    Australian personal-lines direct writer operating entirely outside the
    US-centric ACORD agency-download and agency-management-system world, and
    Australia has no equivalent forcing function: the Consumer Data Right that
    opened banking and energy was designated to extend to general insurance
    and then deferred and de-prioritised, so no open-insurance obligation
    reaches this company.

    Honey's many announced "partnerships" (RACQ, AGL, Finsure, Metricon,
    McGrath, BGC Housing Group, Specialist Finance Group, Bank of Queensland,
    Airtasker, MEBank, Notion) are commercial distribution and embedded-referral
    deals announced in the newsroom. None of them publishes an API, a partner
    developer portal, an onboarding guide or an integration reference. The
    homepage renders a "PartnersCarousel" component, which is a logo strip, not
    an integrations directory.

    Corporate identity confirmed from https://www.honeyinsurance.com/terms/:
    "Honey Insurance Pty Ltd (ABN 52 643 672 628, AFSL 528244)"; general
    insurance products "are issued by RACQ Insurance Limited ABN 50 009 704
    152, AFSL 233082" — the APRA-authorised underwriter behind the brand.

    A GitHub organisation exists at https://github.com/honey-insurance
    (created 2020-10-27, 14 public repositories). Every repository is a fork of
    third-party tooling — middy, spot, openapi-typescript-codegen, libhoney-js,
    beeline-nodejs, json-refs, react-spring, sls-dev-tools,
    aws-lambda-builders, html-to-jsx-transform, aws-sdk-client-mock, dynaglue,
    jscodeshift, iam-identity-center-team-public. There is no first-party
    source, no API definition and no published spec in the org, and the org
    sets no display name, website or description, so attribution to this
    company is plausible (the fork mix reads as an AWS serverless shop, and the
    creation date matches Honey's launch window) but is NOT confirmed. It is
    therefore recorded here only and deliberately omitted from apis.yml.
