    note: |
      Stock Auth0 tenant metadata. No insurance-domain scopes, no published API
      audience, no client-registration path for third parties. The backend at
      api.honeyinsurance.com denies all anonymous requests with HTTP 403 and
      publishes no auth documentation.
  webhooks:
    documented: false
    asyncapi: false
    note: No event catalogue, callback documentation or AsyncAPI definition is published.
  postman:
    public: false
    note: No public Postman collection or workspace was found.
  graphql:
    documented: false
    note: https://api.honeyinsurance.com/graphql returns HTTP 403; no GraphQL endpoint is documented and no SDL is obtainable anonymously.
  grpc:
    documented: false
    note: No .proto files are published.
  transports:
    - protocol: HTTPS (web)
      scheme: https
      baseURL: https://www.honeyinsurance.com/
      documented: true
      note: Consumer marketing and self-service site, server-rendered with Astro, fronted by AWS WAF in ap-southeast-2.
    - protocol: REST
      scheme: https
      baseURL: https://api.honeyinsurance.com
      documented: false
      note: Private AWS API Gateway backing Honey's own funnel and account app. Every probed path returned HTTP 403 {"message":"Forbidden"}. Not a public API.
    - protocol: OIDC
      scheme: https
      baseURL: https://auth.honeyinsurance.com/
      documented: true
      note: Auth0 custom-domain tenant. Anonymous discovery and JWKS are served (HTTP 200), but the audience is consumer account sign-in, not a developer API.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere on the property.
