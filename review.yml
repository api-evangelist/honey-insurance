    bind:
      exposedAsAPI: false
      channel: same consumer web funnel; card payment and policy start online
    issue:
      exposedAsAPI: false
      channel: authenticated consumer portal at https://www.honeyinsurance.com/my-account
    fnol:
      exposedAsAPI: false
      channel: https://www.honeyinsurance.com/my-account/claims, phone 137 138 (24/7), contact@honeyinsurance.com
  authModel:
    scheme: OAuth 2.0 / OpenID Connect (Auth0 custom domain)
    audience: end-user consumer accounts only
    developerCredentials: false
    issuer: https://auth.honeyinsurance.com/
    authorizationEndpoint: https://auth.honeyinsurance.com/authorize
    tokenEndpoint: https://auth.honeyinsurance.com/oauth/token
